context:
  version: "0.5.1"

package:
  name: "stare-atlas"
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/78/4d/4f63dd9f6a3cf1ed892203087704e36ec119e0d0d7e54052d4491b277a54/stare-${{ version }}.tar.gz
  sha256: c0720c5958e9bf36fcc20b001c56c41e0f3c2f3a8ef250faa963b34b8d61b113

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0
  python:
    entry_points:
      - stare = stare.cli:app

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - httpx
    - hishel
    - keyring
    - pyjwt
    - cryptography
    - filelock
    - pydantic >=2
    - pydantic-settings >=2
    - typer
    - rich
    - platformdirs
    - lark
    - tomli  # drop when python_min >= 3.11

tests:
  - python:
      imports:
        - stare
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      stare --help

about:
  homepage: https://github.com/kratsg/stage
  summary: 'Python library and CLI for the CERN ATLAS Glance/Fence API'
  description: |
    stare is a Python library and CLI for the CERN ATLAS Glance/Fence API.
    It provides typed access to analyses, papers, CONF notes, PUB notes,
    publications, groups, subgroups, and triggers — with OAuth2 PKCE authentication
    against CERN Keycloak built in.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  documentation: https://stare-atlas.readthedocs.io/
  repository: https://github.com/kratsg/stare

extra:
  recipe-maintainers:
    - kratsg
